name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            asset_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            asset_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & Release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bilibili summary ${{ github.ref_name }}"
          releaseBody: "B站 / YouTube 视频摘要桌面工具（Tauri 2 + TypeScript）。"
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      # 删除 tauri-action 自动上传的 updater 压缩包（不需要 .app.tar.gz）
      - name: Remove updater .app.tar.gz
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ github.ref_name }}" \
            "bilibili.summary_${{ matrix.asset_arch }}.app.tar.gz" --yes || echo "skip"

      # 上传 Windows 便携版（裸 exe，双击即用，运行时按需下载二进制）
      - name: Upload portable exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "src-tauri/target/release/bilibili-summary.exe" \
            "src-tauri/target/release/bilibili-summary-portable.exe"
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/target/release/bilibili-summary-portable.exe" --clobber
